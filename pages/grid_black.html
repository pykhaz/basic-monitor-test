<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Monitor test -- grid</title>
        <style>
            :root {
            /* Default size of a single cell (width x height) */
            --grid-width: 160px;
            --grid-height: 160px;
            }

            body {
            margin: 0;
            min-height: 100vh;
            background-color: #000000; /* Background colour */

            /* Plotting of vertical and horizontal grid lines */
            background-image: 
            linear-gradient(to right, rgba(255, 255, 255, 1) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255, 255, 255, 1) 2px, transparent 1px);

            /* Size of a single grid cell (width x height) */
            background-size: var(--grid-width) var(--grid-height);
            }
            scrollbar {display: none;}
            ::-webkit-scrollbar {
            display: none;
            }
        </style>
        <meta name="darkreader-lock" content="">
        <meta name="color-scheme" content="dark">
        <link rel="icon" href="../favicon.ico">
    </head>

    <body>

    <script src="../js/queue.js"></script>
    <script>
        // Default size and scaling limits (in pixels)
        let gridWidth = 160;
        let gridHeight = 160;

        const MIN_SIZE = 40;   // Minimal cell size
        const MAX_SIZE = 800;  // Maximal cell size
        const STEP = 40;       // Speed of change when turning the wheel

        const touchXes = new Queue();
        const touchYes = new Queue();

        // Width to height ratio (1 = square, 1.5 = rectangle)
        const ASPECT_RATIO = 1.0;

       window.addEventListener('wheel', (event) => {
            // Preventing default page scrolling
            event.preventDefault();

            // event.deltaY < 0 -> turning the wheel up (enlarging)
            if (event.deltaY < 0) {
            gridWidth = Math.min(MAX_SIZE, gridWidth + STEP);
            } else {
            gridWidth = Math.max(MIN_SIZE, gridWidth - STEP);
            }

            handleEvent(gridWidth);
        }, { passive: false }); // { passive: false } is required,
        //                       for preventDefault() to work


       window.addEventListener('touchend', (e) => {
                e.preventDefault(); // Locks page scrolling
                                    //  during the swipe

                touchXes.clear();
                touchYes.clear();
                // handleGesture("touchend");
            }, { passive: false });


       document.body.addEventListener('touchmove', (event) => {
            event.preventDefault(); // Locks page scrolling
                                    //  during the swipe

            touchXes.enqueue(event.touches[0].clientX);
            touchYes.enqueue(event.touches[0].clientY);
            const deltaX = touchXes.peek(-1) - touchXes.peek();
            const deltaY = touchYes.peek(-1) - touchYes.peek();

            const coef = 3;

            if (deltaY < 0) {
            gridWidth = Math.min(MAX_SIZE, gridWidth + STEP);
            } else {
            gridWidth = Math.max(MIN_SIZE, gridWidth - STEP);
            }

            handleEvent(gridWidth);
            }, { passive: false });

        function handleEvent(width) {
            height = width * ASPECT_RATIO;

            // Update of CSS variables
            document.documentElement.style.setProperty('--grid-width',
                                                       `${width}px`);
            document.documentElement.style.setProperty('--grid-height',
                                                       `${height}px`);
        }
    </script>
    <script src="../js/full_screen.js"></script>

    </body>
</html>
