<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Monitor test -- white</title>
        <link rel="stylesheet" href="../css/style.css">
        <style>
            body {
                margin: 0;
                height: 100vh;
                /* Ustaw 0% dla testu czerni lub 100% dla testu bieli */
                background-color: hsl(0, 0%, 100%);
                display: flex;
                justify-content: flex-end;
                align-items: flex-end;
                font-family: monospace;
                user-select: none;
            }
        </style>
        <meta name="darkreader-lock" content="">
        <link rel="icon" href="../favicon.ico">
    </head>
    <body style="border: solid 5rem #FFFFFF; ">

        <div id="info"
        style="border: solid gray 2px; color: rgba(75, 75, 75, 0.8);
        background-color: rgba(125, 125, 125, 0.6);">
        Lightness: <span id="l-val"
        style="background-color: rgba(200, 200, 200, 0.6);">100.0</span>% 
        | Hex: <span id="hex-val">#FFFFFF</span>
        </div>

        <script src="../js/info.js"></script>
        <script src="../js/info_vis.js"></script>
        <script src="../js/full_screen.js"></script>

    </body>
</html>
